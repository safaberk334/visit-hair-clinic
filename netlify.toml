# Visit Hair Clinic — Netlify yapilandirmasi
#
# Site onceden uretilmis statik HTML'den ibaret. Sayfalar yerelde
#   python gen_i18n.py && python gen_legal.py
# ile uretilip commit ediliyor, bu yuzden Netlify'da build adimi yok.
# (gen_i18n.py lxml'e bagli; derlemeyi yerelde tutmak CI'yi kirilgan yapmiyor.)

[build]
  publish = "."

# --- Ana sayfada tarayici diline gore yonlendirme ----------------------
# Kok (EN) x-default olarak kaliyor; Googlebot Accept-Language gondermedigi
# icin EN'i gorur. Telefonu Turkce/Arapca/Italyanca olan ziyaretci kendi
# diline gider. Dil secicide elle secilen dil nf_lang cereziyle (main.js)
# bu tespiti ezer. force: kokte index.html var, yoksa kural atlanir.
[[redirects]]
  from = "/"
  to = "/tr/"
  status = 302
  force = true
  conditions = {Language = ["tr"]}

[[redirects]]
  from = "/"
  to = "/ar/"
  status = 302
  force = true
  conditions = {Language = ["ar"]}

[[redirects]]
  from = "/"
  to = "/it/"
  status = 302
  force = true
  conditions = {Language = ["it"]}

# --- Kaynak dosyalar yayina cikmasin -----------------------------------
# Depo koku ayni zamanda yayin klasoru oldugu icin sablon ve uretici
# scriptler de sunuluyordu. _template.html ana sayfanin neredeyse birebir
# kopyasi; Google'in bunu ayri bir sayfa olarak indekslemesi duplicate
# content demek. Hepsi 404 donuyor.

[[redirects]]
  from = "/_template.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/gen_i18n.py"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/gen_legal.py"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/i18n/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

# main.src.js ceviri blogunu iceren kaynak dosya; yayina cikan surum
# js/main.js. 48 KB olu agirlik, taranmasinin da faydasi yok.
[[redirects]]
  from = "/js/main.src.js"
  to = "/404.html"
  status = 404
  force = true

# --- Guvenlik basliklari ---------------------------------------------
# X-Frame-Options ve CSP bilerek eklenmedi: main.js onizlemede iframe
# tespiti yapiyor, CSS/JS de unpkg + fonts.googleapis'ten geliyor.
# Bu ikisi once self-host'a gecince guvenle eklenebilir.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
