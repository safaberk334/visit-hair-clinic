<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sayfa Bulunamadı | Visit Hair Clinic</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" sizes="48x48" href="img/logo/favicon-48.png">
  <link rel="icon" type="image/png" sizes="512x512" href="img/logo/favicon.png">
  <link rel="apple-touch-icon" href="img/logo/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: linear-gradient(160deg, #FFFFFF 0%, #EFF6FB 100%);
      color: #1A1A1A;
    }
    .e404__logo { height: 52px; width: auto; margin-bottom: 40px; }
    .e404__code {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(72px, 18vw, 140px);
      font-weight: 800;
      line-height: 1;
      color: #E42320;
      letter-spacing: -2px;
    }
    .e404__title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(22px, 5vw, 30px);
      font-weight: 700;
      margin: 16px 0 12px;
    }
    .e404__text { color: #6B6B6B; font-size: 16px; max-width: 420px; margin: 0 auto 36px; line-height: 1.6; }
    .e404__btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #E42320;
      color: #fff;
      text-decoration: none;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 600;
      font-size: 15px;
      padding: 14px 32px;
      border-radius: 9999px;
      transition: transform .25s ease, box-shadow .25s ease;
    }
    .e404__btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(228,35,32,0.32); }
  </style>
</head>
<body>
  <main>
    <img src="img/logo/logo-transparent.png" alt="Visit Hair Clinic" class="e404__logo">
    <div class="e404__code">404</div>
    <h1 class="e404__title">Sayfa bulunamadı</h1>
    <p class="e404__text">Aradığınız sayfa taşınmış veya hiç var olmamış olabilir. Ana sayfaya dönüp tekrar deneyebilirsiniz.</p>
    <a href="/" class="e404__btn">← Ana sayfaya dön</a>
  </main>
</body>
</html>
